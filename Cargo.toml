[package]
name = "ampered"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Power management daemon for Linux laptops under Wayland"
readme = "README.md"

[lib]
name = "ampered"
path = "src/lib.rs"

[[bin]]
name = "ampered"
path = "src/main.rs"

[[bin]]
name = "amperedctl"
path = "src/bin/amperedctl.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
humantime = "2"
nix = { version = "0.29", features = ["user", "fs", "signal", "socket", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
    "sync",
    "io-util",
    "process",
    "fs",
] }
toml = { version = "0.8", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
